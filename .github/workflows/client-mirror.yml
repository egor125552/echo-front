name: Client Mirror

on:
  push:
    branches: [main]
    paths:
      - client/**
      - public/client/**
      - scripts/check-client-mirror.mjs
      - package.json
      - .github/workflows/client-mirror.yml
  pull_request:
    paths:
      - client/**
      - public/client/**
      - scripts/check-client-mirror.mjs
      - package.json
      - .github/workflows/client-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify served client matches source client
        run: npm run check:client-mirror
