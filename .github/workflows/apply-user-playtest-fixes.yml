name: Apply journal-driven playtest fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-user-playtest-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch anchor missing: {path}: {old[:80]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          for path in ["client/plugins/spatial-audio.js", "public/client/plugins/spatial-audio.js"]:
              patch(path,
                  '  let muffleCutoff = MASTER_FILTER_MAX_HZ;\n  let foregroundMuffleCutoff = MASTER_FILTER_MAX_HZ;\n',
                  '  let muffleCutoff = MASTER_FILTER_MAX_HZ;\n  let cabinMuffleCutoff = MASTER_FILTER_MAX_HZ;\n  let effectiveMuffleCutoff = MASTER_FILTER_MAX_HZ;\n  let foregroundMuffleCutoff = MASTER_FILTER_MAX_HZ;\n')
              patch(path,
                  '''  function setMuffleCutoff(value) {\n    const numeric = Number(value);\n    muffleCutoff = Math.max(\n      MASTER_FILTER_MIN_HZ,\n      Math.min(MASTER_FILTER_MAX_HZ, Number.isFinite(numeric) ? numeric : MASTER_FILTER_MAX_HZ),\n    );\n    foregroundMuffleCutoff = softenedMuffleCutoff(muffleCutoff);\n    targetParam(masterLowpass.frequency, muffleCutoff, 0.36);\n    targetParam(foregroundLowpass.frequency, foregroundMuffleCutoff, 0.22);\n  }\n''',
                  '''  function normalizedMuffleCutoff(value) {\n    const numeric = Number(value);\n    return Math.max(\n      MASTER_FILTER_MIN_HZ,\n      Math.min(MASTER_FILTER_MAX_HZ, Number.isFinite(numeric) ? numeric : MASTER_FILTER_MAX_HZ),\n    );\n  }\n\n  function applyMuffleCutoffs() {\n    effectiveMuffleCutoff = Math.min(muffleCutoff, cabinMuffleCutoff);\n    foregroundMuffleCutoff = softenedMuffleCutoff(effectiveMuffleCutoff);\n    targetParam(masterLowpass.frequency, effectiveMuffleCutoff, 0.22);\n    targetParam(foregroundLowpass.frequency, foregroundMuffleCutoff, 0.18);\n  }\n\n  function setMuffleCutoff(value) {\n    muffleCutoff = normalizedMuffleCutoff(value);\n    applyMuffleCutoffs();\n  }\n\n  function setCabinMuffleCutoff(value) {\n    cabinMuffleCutoff = normalizedMuffleCutoff(value);\n    applyMuffleCutoffs();\n  }\n''')
              patch(path,
                  '    setMuffleCutoff,\n    getMuffleCutoff() { return muffleCutoff; },\n    getForegroundMuffleCutoff() { return foregroundMuffleCutoff; },\n',
                  '    setMuffleCutoff,\n    getMuffleCutoff() { return muffleCutoff; },\n    setCabinMuffleCutoff,\n    getCabinMuffleCutoff() { return cabinMuffleCutoff; },\n    getEffectiveMuffleCutoff() { return effectiveMuffleCutoff; },\n    getForegroundMuffleCutoff() { return foregroundMuffleCutoff; },\n')

          for path in ["client/plugins/battle-royale-vehicle-audio.js", "public/client/plugins/battle-royale-vehicle-audio.js"]:
              patch(path,
                  'const CRASH_RADIUS = 120;\n',
                  'const CRASH_RADIUS = 120;\nconst CABIN_TRUCK_CUTOFF_HZ = 3600;\nconst CABIN_SPORT_CUTOFF_HZ = 4600;\nconst CABIN_OPEN_CUTOFF_HZ = 18000;\n')
              patch(path,
                  '''  function playerFor(snapshot) {\n    const observedId = snapshot?.spectator?.active\n      ? snapshot.spectator.targetId\n      : network.playerId;\n    return snapshot?.entities?.find((entity) => entity.id === observedId) ?? null;\n  }\n''',
                  '''  function observedPlayerId(snapshot) {\n    return snapshot?.spectator?.active\n      ? snapshot.spectator.targetId\n      : network.playerId;\n  }\n\n  function playerFor(snapshot) {\n    const observedId = observedPlayerId(snapshot);\n    return snapshot?.entities?.find((entity) => entity.id === observedId) ?? null;\n  }\n\n  function updateCabinMuffle(snapshot) {\n    const observedId = observedPlayerId(snapshot);\n    const driven = (Array.isArray(snapshot?.vehicles) ? snapshot.vehicles : [])\n      .find((vehicle) => vehicle?.driverId === observedId) ?? null;\n    const cutoff = !driven\n      ? CABIN_OPEN_CUTOFF_HZ\n      : profileFor(driven) === "sport"\n        ? CABIN_SPORT_CUTOFF_HZ\n        : CABIN_TRUCK_CUTOFF_HZ;\n    audio.setCabinMuffleCutoff?.(cutoff);\n  }\n''')
              patch(path,
                  '''  function updateEngine(snapshot) {\n    if (snapshot?.mode !== "battle-royale") {\n      stopEngine();\n      return;\n    }\n''',
                  '''  function updateEngine(snapshot) {\n    if (snapshot?.mode !== "battle-royale") {\n      audio.setCabinMuffleCutoff?.(CABIN_OPEN_CUTOFF_HZ);\n      stopEngine();\n      return;\n    }\n    updateCabinMuffle(snapshot);\n''')
              patch(path,
                  '''  ctx.events.on("network:disconnected", () => {\n    audio.stopChannel(BRAKE_CHANNEL);\n    stopEngine();\n  });\n''',
                  '''  ctx.events.on("network:disconnected", () => {\n    audio.setCabinMuffleCutoff?.(CABIN_OPEN_CUTOFF_HZ);\n    audio.stopChannel(BRAKE_CHANNEL);\n    stopEngine();\n  });\n''')

          patch("src/plugins/movement/server.js", 'version: "2.2.0"', 'version: "2.2.1"')
          patch("src/plugins/movement/server.js",
              '''    const worldObject = collision?.worldObject;\n    if (!worldObject) continue;\n    const explicitSpeech = String(worldObject.accessibleSpeech ?? "").trim();\n''',
              '''    const worldObject = collision?.worldObject;\n    if (!worldObject) continue;\n    // Floors and stair ramps are support surfaces, not obstacles. Rapier may\n    // report them while resolving slope/ground contact; announcing them as a\n    // blocked move produces the misleading “Здесь лестница” loop.\n    if (NAVIGABLE_SUPPORT_KINDS.has(String(worldObject.kind ?? ""))) continue;\n    const explicitSpeech = String(worldObject.accessibleSpeech ?? "").trim();\n''')

          patch("src/plugins/battle-royale-dropzone-vehicle/server.js",
              'export const DROPZONE_VEHICLE_ID = "br-jeep-2";',
              'export const DROPZONE_VEHICLE_ID = "br-supercar-1";')
          patch("src/plugins/battle-royale-dropzone-vehicle/server.js", 'version: "1.1.0"', 'version: "1.2.0"')
          patch("src/plugins/battle-royale-dropzone-vehicle/server.js",
              '''      .filter((vehicle) => vehicle.kind === "offroad")\n      // Leave the original primary jeep alone because it is also the legacy\n      // integration anchor. The seven fleet jeeps are safe to relocate.\n      .filter((vehicle) => vehicle.id !== vehicles.vehicleId)\n''',
              '      .filter((vehicle) => vehicle.kind === "supercar")\n')
          patch("src/plugins/battle-royale-dropzone-vehicle/server.js",
              'vehicle.accessibleName ?? "внедорожник"',
              'vehicle.accessibleName ?? "суперкар"')
          patch("src/plugins/battle-royale-dropzone-vehicle/server.js",
              '(vehicles.snapshot?.() ?? []).filter((vehicle) => vehicle.kind === "offroad")',
              '(vehicles.snapshot?.() ?? []).filter((vehicle) => vehicle.kind === "supercar")')

          patch("src/plugins/battle-royale-navigation-stability/server.js",
              '    const cooldownReady = now - tracker.lastReplanAt >= MISSED_CHECKPOINT_REPLAN_COOLDOWN_MS;\n',
              '''    const stats = statsFor(playerId);\n    const lastRecoveryAt = Number(stats.lastRecoveryAt);\n    const globalRecoveryAt = Number.isFinite(lastRecoveryAt) ? lastRecoveryAt : -Infinity;\n    const cooldownReady = now - Math.max(tracker.lastReplanAt, globalRecoveryAt)\n      >= MISSED_CHECKPOINT_REPLAN_COOLDOWN_MS;\n''')
          PY

      - name: Syntax checks
        run: |
          node --check client/plugins/spatial-audio.js
          node --check public/client/plugins/spatial-audio.js
          node --check client/plugins/battle-royale-vehicle-audio.js
          node --check public/client/plugins/battle-royale-vehicle-audio.js
          node --check src/plugins/movement/server.js
          node --check src/plugins/battle-royale-dropzone-vehicle/server.js
          node --check src/plugins/battle-royale-navigation-stability/server.js

      - name: Commit fixes and remove one-time workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-user-playtest-fixes.yml
          git add client/plugins/spatial-audio.js public/client/plugins/spatial-audio.js \
            client/plugins/battle-royale-vehicle-audio.js public/client/plugins/battle-royale-vehicle-audio.js \
            src/plugins/movement/server.js src/plugins/battle-royale-dropzone-vehicle/server.js \
            src/plugins/battle-royale-navigation-stability/server.js
          git commit -m "Fix cabin audio, stair feedback, dropzone car and route recovery"
          git push origin HEAD:main
