name: Apply Rapier Diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-rapier-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply diagnostics patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/rapier-diagnostics.patch
          git apply --check /tmp/rapier-diagnostics.patch
          git apply /tmp/rapier-diagnostics.patch
          node --check src/plugins/rapier-physics/server.js
          node --check src/server/engine-diagnostics.js
          node --check src/server/engine-console.js
          node --check src/config/engine-diagnostics.js

      - name: Commit applied diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Echo Front Engine Control'
          git config user.email 'actions@users.noreply.github.com'
          git add src/plugins/rapier-physics/server.js src/server/engine-diagnostics.js src/server/engine-console.js src/config/engine-diagnostics.js
          git rm .github/workflows/apply-rapier-diagnostics.yml
          git commit -m 'Add Rapier physics diagnostics'
          git push