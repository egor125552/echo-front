name: Finalize Rapier Diagnostics Clean

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-rapier-diagnostics-clean.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source transformations
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/rapier-transform.py
          python /tmp/rapier-transform.py
          node --check src/plugins/rapier-physics/server.js
          node --check src/server/engine-console.js
          node --check src/config/engine-diagnostics.js
          node --check src/config/engine-command-request.js
      - name: Commit and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Echo Front Engine Control'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-rapier-diagnostics-fallback.yml
          rm -f .github/workflows/apply-rapier-diagnostics-fallback2.yml
          rm -f .github/workflows/apply-rapier-diagnostics-final.yml
          rm -f .github/workflows/finalize-rapier-diagnostics-clean.yml
          git add -A
          git commit -m 'Finalize Rapier diagnostics telemetry'
          git push
