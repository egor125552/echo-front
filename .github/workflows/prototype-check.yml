name: Prototype Check

on:
  push:
    branches:
      - main
      - playable-plugin-prototype-work
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm test
      - run: npx wrangler deploy --dry-run
