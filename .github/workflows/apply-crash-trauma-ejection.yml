name: Apply crash trauma and ejection separation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-crash-trauma-ejection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/separate-crash-trauma-from-ejection.patch.gz.b64 | gzip -d > /tmp/crash-trauma-ejection.patch
          git apply --check /tmp/crash-trauma-ejection.patch
          git apply /tmp/crash-trauma-ejection.patch
          node --check src/plugins/battle-royale-parkour-ragdoll/server.js
          node --check src/plugins/battle-royale-ragdoll-damage/server.js
          git diff --check
      - name: Commit verified crash behavior
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/separate-crash-trauma-from-ejection.patch.gz.b64
          rm -f .github/workflows/apply-crash-trauma-ejection.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Separate crash trauma from driver ejection'
          git push
