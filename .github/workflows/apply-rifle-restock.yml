name: Apply duplicate rifle crate restock fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-rifle-restock.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch duplicate rifle loot
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}")
              p.write_text(text.replace(old, new, count))

          patch("src/plugins/weapons/server.js", 'version: "1.9.0"', 'version: "1.9.1"')
          patch("src/plugins/weapons/server.js",
          '''  function fire(entityId, now = Date.now()) {\n''',
          '''  function restock(entityId, weaponId, reserveAmount = 60) {\n    const inventory = ctx.components.get(entityId, "Weapons");\n    const definition = DEFINITIONS[weaponId];\n    const weapon = inventory?.items?.find((item) => item.id === weaponId) ?? null;\n    if (!weapon || !definition) return 0;\n    const amount = Math.max(1, Math.floor(Number(reserveAmount) || 60));\n    const reserveCap = Math.max(definition.reserve, definition.reserve * 2);\n    const before = Math.max(0, Number(weapon.reserve) || 0);\n    weapon.reserve = Math.min(reserveCap, before + amount);\n    const added = weapon.reserve - before;\n    if (added > 0) {\n      ctx.events.emit("weapon:ammo-restocked", { entityId, weaponId, added, reserve: weapon.reserve });\n    }\n    return added;\n  }\n\n  function fire(entityId, now = Date.now()) {\n''')
          patch("src/plugins/weapons/server.js",
          '''    fire,\n    grant,\n    has(entityId, weaponId) {\n''',
          '''    fire,\n    grant,\n    restock,\n    has(entityId, weaponId) {\n''')

          patch("src/plugins/battle-royale-match-api/server.js",
          '''    if (result.loot === "rifle") applied = weapons.grant(playerId, "rifle");\n    if (result.loot === "armor") {\n''',
          '''    let restocked = false;\n    if (result.loot === "rifle") {\n      applied = weapons.grant(playerId, "rifle");\n      if (!applied) {\n        quantity = weapons.restock?.(playerId, "rifle", 60) ?? 0;\n        restocked = quantity > 0;\n        applied = restocked;\n      }\n    }\n    if (result.loot === "armor") {\n''')
          patch("src/plugins/battle-royale-match-api/server.js",
          '''      applied,\n      quantity,\n      x: result.x,\n''',
          '''      applied,\n      quantity,\n      restocked,\n      x: result.x,\n''')

          old = '''      if (packet.event === "loot:picked" && payload.entityId === network.playerId) {\n        if (payload.loot === "rifle") announce(payload.applied ? "Автомат подобран" : "Автомат уже есть", { interrupt: false });\n        if (payload.loot === "armor" && !payload.applied) announce("Запас бронепластин полон", { interrupt: false });\n      }\n'''
          new = '''      if (packet.event === "loot:picked" && payload.entityId === network.playerId) {\n        if (payload.loot === "rifle") {\n          if (payload.restocked) announce(`Патроны к автомату: ${Math.max(0, Number(payload.quantity) || 0)}`, { interrupt: false });\n          else announce(payload.applied ? "Автомат подобран" : "Боезапас автомата полон", { interrupt: false });\n        }\n        if (payload.loot === "armor" && !payload.applied) announce("Запас бронепластин полон", { interrupt: false });\n      }\n'''
          for path in ["client/plugins/announcer.js", "public/client/plugins/announcer.js"]:
              patch(path, old, new)
          PY
      - name: Syntax checks
        run: |
          node --check src/plugins/weapons/server.js
          node --check src/plugins/battle-royale-match-api/server.js
          node --check client/plugins/announcer.js
          node --check public/client/plugins/announcer.js
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-rifle-restock.yml
          git add src/plugins/weapons/server.js src/plugins/battle-royale-match-api/server.js client/plugins/announcer.js public/client/plugins/announcer.js
          git commit -m "Make duplicate rifle crates restock ammo"
          git push origin HEAD:main
