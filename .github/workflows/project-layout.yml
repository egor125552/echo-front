name: Project Layout

on:
  push:
    branches: [main]
    paths:
      - client/**
      - public/client/**
      - assets/audio/**
      - public/audio/**
      - public/assets/audio/**
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.ogg'
      - '**/*.m4a'
      - '**/*.aac'
      - '**/*.flac'
      - scripts/check-project-layout.mjs
      - scripts/check-audio-assets.mjs
      - scripts/check-client-imports.mjs
      - scripts/check-client-preset.mjs
      - scripts/check-server-presets.mjs
      - package.json
      - .github/workflows/project-layout.yml
  pull_request:
    paths:
      - client/**
      - public/client/**
      - assets/audio/**
      - public/audio/**
      - public/assets/audio/**
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.ogg'
      - '**/*.m4a'
      - '**/*.aac'
      - '**/*.flac'
      - scripts/check-project-layout.mjs
      - scripts/check-audio-assets.mjs
      - scripts/check-client-imports.mjs
      - scripts/check-client-preset.mjs
      - scripts/check-server-presets.mjs
      - package.json
      - .github/workflows/project-layout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify one client tree and one audio tree
        run: npm run check:project-layout
      - name: Verify client JavaScript syntax
        run: find public/client -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Verify client module imports
        run: npm run check:client-imports
      - name: Verify client preset and dependencies
        run: npm run check:client-preset
      - name: Verify server preset coverage
        run: npm run check:server-presets
      - name: Verify runtime audio assets
        run: npm run check:audio
      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Start local Worker
        run: |
          npx wrangler dev --port 8787 > /tmp/echo-front-layout.log 2>&1 &
          echo $! > /tmp/echo-front-layout.pid
          node --input-type=module - <<'NODE'
          for (let attempt = 0; attempt < 40; attempt += 1) {
            try {
              const response = await fetch('http://127.0.0.1:8787/api/health');
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          process.exit(1);
          NODE
      - name: Verify canonical served assets
        run: |
          node --input-type=module - <<'NODE'
          const paths = [
            '/client/bootstrap.js',
            '/assets/audio/core/pistol-shot.mp3',
            '/assets/audio/environment/arena-ambient.mp3',
            '/assets/audio/vehicles/ts3/engine.mp3',
          ];
          for (const path of paths) {
            const response = await fetch(`http://127.0.0.1:8787${path}`);
            const bytes = (await response.arrayBuffer()).byteLength;
            console.log(response.status, bytes, path);
            if (response.status !== 200 || bytes <= 100) process.exit(1);
          }
          NODE
      - name: Show Worker log on failure
        if: failure()
        run: cat /tmp/echo-front-layout.log || true
