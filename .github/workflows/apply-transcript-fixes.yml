name: Apply Transcript Fixes

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-transcript-fixes.mjs
      - .github/workflows/apply-transcript-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact patches
        run: node scripts/apply-transcript-fixes.mjs
      - name: Syntax checks
        run: |
          node --check src/plugins/movement/server.js
          node --check src/plugins/battle-royale-building-factory/server.js
          node --check src/plugins/battle-royale-navigation/server.js
          node --check src/plugins/battle-royale-ragdoll-tuning/server.js
          node --check src/plugins/battle-royale-parkour-ragdoll/server.js
          node --check src/plugins/battle-royale-ragdoll/server.js
      - name: Remove one-shot patch machinery
        run: |
          rm -f scripts/apply-transcript-fixes.mjs
          rm -f .github/workflows/apply-transcript-fixes.yml
      - name: Commit fixes
        run: |
          git config user.name "Echo Front Engine Control"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix transcript-reported movement navigation and ragdoll bugs"
          git push origin main
