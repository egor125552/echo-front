name: Add Rapier body controls for engine diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-rapier-engine-control.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified Rapier control patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/rapier-control.patch
          git apply --check /tmp/rapier-control.patch
          git apply /tmp/rapier-control.patch
          node --check src/plugins/rapier-physics/server.js
          git diff --check
      - name: Commit and remove installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Echo Front Engine Control'
          git config user.email 'actions@users.noreply.github.com'
          git add src/plugins/rapier-physics/server.js
          git rm -f .github/workflows/apply-rapier-engine-control.yml
          git diff --cached --check
          git commit -m 'Expose safe Rapier body controls for diagnostics'
          git push
