name: Finalize Rapier Diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-rapier-diagnostics-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final diagnostics patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/rapier-final.patch
          git apply --check /tmp/rapier-final.patch
          git apply /tmp/rapier-final.patch
          node --check src/plugins/rapier-physics/server.js
          node --check src/server/engine-console.js
          node --check src/config/engine-diagnostics.js
      - name: Commit clean final state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Echo Front Engine Control'
          git config user.email 'actions@users.noreply.github.com'
          git add src/plugins/rapier-physics/server.js src/server/engine-console.js src/config/engine-diagnostics.js
          git rm -f .github/workflows/apply-rapier-diagnostics-final.yml .github/workflows/apply-rapier-diagnostics-fallback.yml .github/workflows/apply-rapier-diagnostics-fallback2.yml 2>/dev/null || true
          git commit -m 'Refine Rapier diagnostics telemetry'
          git push
