name: BR Bot Dismount Regression

on:
  push:
    branches: [main]
    paths:
      - src/plugins/battle-royale-bot-vehicles/**
      - src/plugins/battle-royale-bot-combat/**
      - src/plugins/battle-royale-bot-parachute/**
      - src/plugins/battle-royale-parachute-integration/**
      - src/plugins/battle-royale-match-api/**
      - src/plugins/battle-royale/**
      - src/plugins/battle-royale-vehicle-fleet/**
      - src/server/engine-lab.js
      - scripts/check-br-dismount-foot-ai-replay.mjs
      - scripts/check-br-grounded-bot-during-deployment.mjs
      - package.json
      - .github/workflows/br-bot-dismount-regression.yml
  pull_request:
    paths:
      - src/plugins/battle-royale-bot-vehicles/**
      - src/plugins/battle-royale-bot-combat/**
      - src/plugins/battle-royale-bot-parachute/**
      - src/plugins/battle-royale-parachute-integration/**
      - src/plugins/battle-royale-match-api/**
      - src/plugins/battle-royale/**
      - src/plugins/battle-royale-vehicle-fleet/**
      - src/server/engine-lab.js
      - scripts/check-br-dismount-foot-ai-replay.mjs
      - scripts/check-br-grounded-bot-during-deployment.mjs
      - package.json
      - .github/workflows/br-bot-dismount-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dismount-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Replay actual bot dismount and deployment transition
        run: npm run check:br-bot-dismount
