name: Apply force-based vehicle crashes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-force-based-vehicle-crashes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/force-based-vehicle-crashes.patch.gz.b64 | gzip -d > /tmp/force-based-vehicle-crashes.patch
          git apply --check /tmp/force-based-vehicle-crashes.patch
          git apply /tmp/force-based-vehicle-crashes.patch
          node --check src/plugins/rapier-physics/server.js
          node --check src/plugins/battle-royale-vehicle/server.js
          node --check src/plugins/battle-royale-vehicle-fleet/server.js
          node --check src/plugins/battle-royale-parkour-ragdoll/server.js
          node --check client/plugins/battle-royale-vehicle-audio.js
          node --check public/client/plugins/battle-royale-vehicle-audio.js
          node --check public/client/plugins/gamepad-haptics.js
          git diff --check
      - name: Commit verified crash integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/force-based-vehicle-crashes.patch.gz.b64
          rm -f .github/workflows/apply-force-based-vehicle-crashes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Drive vehicle crash effects from Rapier force'
          git push
