name: Apply navigation and house guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-navigation-house-guard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused patch
        run: python3 scripts/apply-navigation-house-guard.py

      - name: Syntax checks
        run: |
          node --check src/plugins/battle-royale-navigation/server.js
          node --check src/plugins/battle-royale-building-design-validator/server.js
          node --check src/config/battle-royale-buildings.js
          node --check src/plugins/battle-royale-match-api/server.js

      - name: Validate declarative buildings
        run: |
          node --input-type=module <<'NODE'
          const mod = await import('./src/plugins/battle-royale-building-design-validator/server.js');
          const provided = new Map();
          const factory = { createBuilding(spec) { return spec; } };
          await mod.setup({
            services: {
              get(name) {
                if (name === 'building-factory') return factory;
                throw new Error(`Unexpected service ${name}`);
              },
              provide(name, value) { provided.set(name, value); },
            },
          });
          const reports = provided.get('building-design-validator').validateAll();
          console.log(JSON.stringify(reports));
          if (reports.some((report) => !report.ok || report.warnings.length)) process.exit(1);
          NODE

      - name: Commit focused changes and remove one-time patch files
        run: |
          rm -f scripts/apply-navigation-house-guard.py
          rm -f .github/workflows/apply-navigation-house-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugins/battle-royale-navigation/server.js \
                  src/plugins/battle-royale-building-design-validator/server.js \
                  scripts/apply-navigation-house-guard.py \
                  .github/workflows/apply-navigation-house-guard.yml
          git commit -m "Fix navigation after vehicle exit and guard house entrances"
          git push origin HEAD:main
