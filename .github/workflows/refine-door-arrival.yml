name: Refine building door arrival target

on:
  push:
    paths:
      - '.github/workflows/refine-door-arrival.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refine door arrival
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/plugins/battle-royale-building-factory/server.js',
              '? doorWorldPosition(entry.spec, firstDoorFloor, firstDoor)',
              '? doorPassagePoints(entry.spec, firstDoorFloor, firstDoor).outside'
          )
          replace_once(
              'src/plugins/battle-royale-building-factory/server.js',
              'arriveDistance: Math.max(1.2, finite(custom.arriveDistance, 1.6)),',
              'arriveDistance: Math.max(1, finite(custom.arriveDistance, 1)),'
          )
          replace_once(
              'src/plugins/battle-royale-building-targets/server.js',
              'arriveDistance: Math.max(1.2, finite(building.metadata?.arriveDistance, 1.6)),',
              'arriveDistance: Math.max(1, finite(building.metadata?.arriveDistance, 1)),'
          )
          replace_once(
              'src/plugins/battle-royale-navigation-stability/server.js',
              'const VEHICLE_PARKING_CAPTURE_RADIUS = 4.5;',
              'const VEHICLE_PARKING_CAPTURE_RADIUS = 3.5;'
          )
          PY
      - name: Syntax checks
        run: |
          node --check src/plugins/battle-royale-building-factory/server.js
          node --check src/plugins/battle-royale-building-targets/server.js
          node --check src/plugins/battle-royale-navigation-stability/server.js
      - name: Commit and clean up
        shell: bash
        run: |
          rm -f .github/workflows/refine-door-arrival.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/plugins/battle-royale-building-factory/server.js \
                  src/plugins/battle-royale-building-targets/server.js \
                  src/plugins/battle-royale-navigation-stability/server.js
          git add -u .github/workflows/refine-door-arrival.yml
          git commit -m 'Refine building arrival directly in front of doors'
          git push
