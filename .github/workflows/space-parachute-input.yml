name: Space Parachute Input

on:
  push:
    branches: [main]
    paths:
      - public/client/plugins/input.js
      - public/client/plugins/parachute-input.js
      - src/plugins/battle-royale-jump/**
      - src/plugins/battle-royale-parachute/**
      - src/plugins/battle-royale-parachute-integration/**
      - src/plugins/battle-royale-parachute-canopy/**
      - src/plugins/battle-royale-ragdoll/**
      - src/plugins/battle-royale-ragdoll-integration/**
      - src/presets/battle-royale.js
      - scripts/check-space-parachute-input.mjs
      - scripts/check-physical-input-client-pipeline.mjs
      - package.json
      - .github/workflows/space-parachute-input.yml
  pull_request:
    paths:
      - public/client/plugins/input.js
      - public/client/plugins/parachute-input.js
      - src/plugins/battle-royale-jump/**
      - src/plugins/battle-royale-parachute/**
      - src/plugins/battle-royale-parachute-integration/**
      - src/plugins/battle-royale-parachute-canopy/**
      - src/plugins/battle-royale-ragdoll/**
      - src/plugins/battle-royale-ragdoll-integration/**
      - src/presets/battle-royale.js
      - scripts/check-space-parachute-input.mjs
      - scripts/check-physical-input-client-pipeline.mjs
      - package.json
      - .github/workflows/space-parachute-input.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check regression test syntax
        run: |
          node --check public/client/plugins/input.js
          node --check public/client/plugins/parachute-input.js
          node --check scripts/check-space-parachute-input.mjs
          node --check scripts/check-physical-input-client-pipeline.mjs
      - name: Verify physical keyboard client pipeline
        run: npm run check:physical-input
      - name: Verify Space context behavior
        run: npm run check:space-parachute
