name: Fix navigation detour sanity

on:
  push:
    paths:
      - .github/workflows/fix-navigation-detour-sanity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation planner
        shell: bash
        run: |
          FILE=src/plugins/battle-royale-navigation/server.js
          sed -i '/    let bestScore = Infinity;/a\    const directDistance = distance3(from, target.position);' "$FILE"
          sed -i '/      const score = distance3(from, p)/i\      const projectedDistance = distance3(from, p) + distance3(p, target.position);\n      if (candidate.semantic) {\n        const semanticLimit = directDistance + Math.max(36, directDistance * 2.5);\n        if (projectedDistance > semanticLimit) continue;\n      }' "$FILE"
          sed -i '/      const score = distance3(from, p)/,+2c\      const score = projectedDistance + (candidate.semantic ? -2.5 : 0);' "$FILE"
          grep -A28 'function chooseDetour' "$FILE"
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/plugins/battle-royale-navigation/server.js
          git diff --cached --check
          git commit -m 'Reject pathological navigation detours'
          git push
