name: Engine Command

on:
  push:
    branches:
      - main
    paths:
      - src/config/engine-command-request.js
      - .github/workflows/engine-command.yml
  workflow_dispatch:

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read compiled request
        id: request
        run: |
          ID=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.id)))')
          COMMAND=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.command)))')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"
          echo "Request $ID: $COMMAND"

      - name: No request yet
        if: steps.request.outputs.id == '0'
        run: echo "No engine command request has been created yet."

      - name: Wait for compiled request on live Worker
        if: steps.request.outputs.id != '0'
        env:
          REQUEST_ID: ${{ steps.request.outputs.id }}
          HEALTH_URL: https://echo-front.k69ysrndm7.workers.dev/api/health
        run: |
          LAST_ENABLED="unknown"
          LAST_ID="unknown"
          for i in {1..60}; do
            BODY=$(curl --max-time 5 --silent --show-error "$HEALTH_URL" || true)
            ENABLED=$(printf '%s' "$BODY" | jq -r '.engineControlEnabled // false')
            LIVE_ID=$(printf '%s' "$BODY" | jq -r '.engineCommandRequestId // 0')
            LAST_ENABLED="$ENABLED"
            LAST_ID="$LIVE_ID"
            if [ $i -eq 1 ] || [ $((i % 10)) -eq 0 ]; then
              echo "Live engine state: enabled=$ENABLED requestId=$LIVE_ID; wanted requestId=$REQUEST_ID"
            fi
            if [ "$ENABLED" = "true" ] && [ "$LIVE_ID" = "$REQUEST_ID" ]; then
              echo "Live Worker has engine request $LIVE_ID and control is enabled."
              exit 0
            fi
            sleep 3
          done
          echo "Live Worker never exposed request $REQUEST_ID. Final state: enabled=$LAST_ENABLED requestId=$LAST_ID"
          exit 1

      - name: Invoke compiled engine command
        if: steps.request.outputs.id != '0'
        env:
          REQUEST_ID: ${{ steps.request.outputs.id }}
        run: |
          : > engine-command-result.json
          LAST_STATUS="000"
          for i in {1..30}; do
            STATUS=$(curl --max-time 15 --silent --show-error \
              -X POST \
              -H 'Content-Type: application/json' \
              --data "{\"requestId\":${REQUEST_ID}}" \
              --output engine-command-result.json \
              --write-out '%{http_code}' \
              https://echo-front.k69ysrndm7.workers.dev/api/engine-command || true)
            LAST_STATUS="${STATUS:-000}"
            echo "Engine command HTTP $LAST_STATUS (attempt $i)"
            if [ -s engine-command-result.json ]; then
              jq . engine-command-result.json || cat engine-command-result.json
            else
              echo '{"ok":false,"error":"empty engine command response"}' > engine-command-result.json
            fi

            case "$LAST_STATUS" in
              2??)
                exit 0
                ;;
              409)
                echo "Compiled Worker is fresh but the Durable Object may still be on the previous isolate; retrying."
                sleep 2
                ;;
              *)
                echo "Engine command failed with HTTP $LAST_STATUS"
                exit 1
                ;;
            esac
          done
          echo "Engine command never became executable; final HTTP status $LAST_STATUS"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always() && steps.request.outputs.id != '0'
        with:
          name: engine-command-${{ steps.request.outputs.id }}
          path: engine-command-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always() && steps.request.outputs.id != '0'
        run: |
          echo "### Engine command" >> "$GITHUB_STEP_SUMMARY"
          echo "Request: ${{ steps.request.outputs.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: ${{ steps.request.outputs.command }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s engine-command-result.json ]; then
            cat engine-command-result.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No response body was captured." >> "$GITHUB_STEP_SUMMARY"
          fi
