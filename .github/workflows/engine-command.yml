name: Engine Command

on:
  push:
    branches:
      - main
    paths:
      - src/config/engine-command-request.js
      - .github/workflows/engine-command.yml
  workflow_dispatch:

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Read compiled request
        id: request
        run: |
          ID=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.id)))')
          COMMAND=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.command)))')
          REPEAT=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.repeat ?? 1)))')
          FRAME_EVERY=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.frameEvery ?? 1)))')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"
          echo "repeat=$REPEAT" >> "$GITHUB_OUTPUT"
          echo "frame_every=$FRAME_EVERY" >> "$GITHUB_OUTPUT"
          echo "Request $ID: $COMMAND repeat=$REPEAT frameEvery=$FRAME_EVERY"

      - name: No request yet
        if: steps.request.outputs.id == '0'
        run: echo "No engine command request has been created yet."

      - name: Start focused Worker for Engine Control
        if: steps.request.outputs.id != '0'
        env:
          REQUEST_ID: ${{ steps.request.outputs.id }}
        run: |
          timeout 120s npx wrangler dev --port 8787 > /tmp/echo-front-engine-control.log 2>&1 &
          echo $! > /tmp/echo-front-engine-control.pid
          for i in {1..40}; do
            BODY=$(curl --max-time 3 --silent --show-error http://127.0.0.1:8787/api/health || true)
            ENABLED=$(printf '%s' "$BODY" | jq -r '.engineControlEnabled // false')
            LOCAL_ID=$(printf '%s' "$BODY" | jq -r '.engineCommandRequestId // 0')
            if [ "$ENABLED" = "true" ] && [ "$LOCAL_ID" = "$REQUEST_ID" ]; then
              echo "Focused Worker has Engine Control request $LOCAL_ID."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/echo-front-engine-control.log || true
          echo "Focused Worker never exposed request $REQUEST_ID"
          exit 1

      - name: Invoke compiled engine command
        if: steps.request.outputs.id != '0'
        env:
          REQUEST_ID: ${{ steps.request.outputs.id }}
          REPEAT: ${{ steps.request.outputs.repeat }}
          FRAME_EVERY: ${{ steps.request.outputs.frame_every }}
        run: |
          : > engine-command-results.jsonl
          : > engine-command-frames.jsonl
          LIMIT=$(( REPEAT > 0 ? REPEAT : 1 ))
          FRAME=$(( FRAME_EVERY > 0 ? FRAME_EVERY : 1 ))
          for iteration in $(seq 1 "$LIMIT"); do
            TMP=$(mktemp)
            STATUS=$(curl --max-time 60 --silent --show-error \
              -X POST \
              -H 'Content-Type: application/json' \
              --data "{\"requestId\":${REQUEST_ID},\"iteration\":${iteration}}" \
              --output "$TMP" \
              --write-out '%{http_code}' \
              http://127.0.0.1:8787/api/engine-command || true)
            echo "Engine command iteration $iteration HTTP ${STATUS:-000}"
            if [ "${STATUS:-000}" -lt 200 ] || [ "${STATUS:-000}" -ge 300 ]; then
              cat "$TMP" || true
              cat /tmp/echo-front-engine-control.log || true
              rm -f "$TMP"
              exit 1
            fi
            jq -c . "$TMP" >> engine-command-results.jsonl
            echo "ENGINE_CONTROL_RESULT_BEGIN iteration=$iteration"
            jq -c . "$TMP"
            echo "ENGINE_CONTROL_RESULT_END iteration=$iteration"
            if [ $((iteration % FRAME)) -eq 0 ]; then
              jq -c . "$TMP" >> engine-command-frames.jsonl
              echo "Recorded observation frame at iteration $iteration"
            fi
            rm -f "$TMP"
          done

      - uses: actions/upload-artifact@v4
        if: always() && steps.request.outputs.id != '0'
        with:
          name: engine-command-${{ steps.request.outputs.id }}
          path: |
            engine-command-results.jsonl
            engine-command-frames.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Show focused Worker log on failure
        if: failure() && steps.request.outputs.id != '0'
        run: cat /tmp/echo-front-engine-control.log || true

      - name: Summary
        if: always() && steps.request.outputs.id != '0'
        run: |
          echo "### Focused Engine Control" >> "$GITHUB_STEP_SUMMARY"
          echo "Request: ${{ steps.request.outputs.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: ${{ steps.request.outputs.command }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Repeat: ${{ steps.request.outputs.repeat }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frame every: ${{ steps.request.outputs.frame_every }} iterations" >> "$GITHUB_STEP_SUMMARY"
          if [ -s engine-command-frames.jsonl ]; then
            echo "Frames captured: $(wc -l < engine-command-frames.jsonl)" >> "$GITHUB_STEP_SUMMARY"
          fi
