name: Engine Command

on:
  push:
    branches:
      - engine-control
      - stability-restart-hardening
    paths:
      - src/config/engine-command-request.js
      - .github/workflows/engine-command.yml
  workflow_dispatch:

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Verify plugin failure attribution
        run: |
          node --input-type=module <<'NODE'
          import { PluginHost, PluginExecutionError } from './src/core/plugin-host.js';

          const brokenCapability = {
            manifest: { id: 'broken-capability-test', requires: [], capabilities: [] },
            setup(ctx) { ctx.services.provide('should-not-register', {}); },
          };
          try {
            await new PluginHost({ plugins: [brokenCapability] }).start();
            throw new Error('Expected missing capability to fail');
          } catch (error) {
            if (!(error instanceof PluginExecutionError)) throw error;
            if (error.pluginId !== 'broken-capability-test') throw new Error(`Wrong plugin attribution: ${error.pluginId}`);
            if (error.phase !== 'capability-check') throw new Error(`Wrong phase: ${error.phase}`);
          }

          const brokenDependency = {
            manifest: { id: 'broken-dependency-test', requires: ['missing-plugin'], capabilities: [] },
          };
          try {
            new PluginHost({ plugins: [brokenDependency] });
            throw new Error('Expected missing dependency to fail');
          } catch (error) {
            if (!(error instanceof PluginExecutionError)) throw error;
            if (error.pluginId !== 'broken-dependency-test') throw new Error(`Wrong dependency attribution: ${error.pluginId}`);
            if (error.phase !== 'dependency-check') throw new Error(`Wrong dependency phase: ${error.phase}`);
          }
          console.log('Plugin attribution checks passed.');
          NODE

      - name: Read compiled request
        id: request
        run: |
          ID=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.id)))')
          COMMAND=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.command)))')
          REPEAT=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.repeat ?? 1)))')
          FRAME_EVERY=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.frameEvery ?? 1)))')
          ROOM=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.room ?? "public")))')
          MODE=$(node -e 'import("./src/config/engine-command-request.js").then(m => process.stdout.write(String(m.ENGINE_COMMAND_REQUEST.mode ?? "tdm")))')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"
          echo "repeat=$REPEAT" >> "$GITHUB_OUTPUT"
          echo "frame_every=$FRAME_EVERY" >> "$GITHUB_OUTPUT"
          echo "room=$ROOM" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Request $ID: $COMMAND repeat=$REPEAT frameEvery=$FRAME_EVERY room=$ROOM mode=$MODE"

      - name: No request yet
        if: steps.request.outputs.id == '0'
        run: echo "No engine command request has been created yet."

      - name: Start focused Worker for Engine Control
        if: steps.request.outputs.id != '0'
        env:
          REQUEST_ID: ${{ steps.request.outputs.id }}
        run: |
          setsid timeout 120s npx wrangler dev --port 8787 > /tmp/echo-front-engine-control.log 2>&1 &
          echo $! > /tmp/echo-front-engine-control.pid
          for i in {1..40}; do
            BODY=$(curl --max-time 3 --silent --show-error http://127.0.0.1:8787/api/health || true)
            ENABLED=$(printf '%s' "$BODY" | jq -r '.engineControlEnabled // false')
            LOCAL_ID=$(printf '%s' "$BODY" | jq -r '.engineCommandRequestId // 0')
            if [ "$ENABLED" = "true" ] && [ "$LOCAL_ID" = "$REQUEST_ID" ]; then
              echo "Focused Worker has Engine Control request $LOCAL_ID."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/echo-front-engine-control.log || true
          echo "Focused Worker never exposed request $REQUEST_ID"
          exit 1

      - name: Invoke compiled engine command
        if: steps.request.outputs.id != '0'
        env:
          REQUEST_ID: ${{ steps.request.outputs.id }}
          REPEAT: ${{ steps.request.outputs.repeat }}
          FRAME_EVERY: ${{ steps.request.outputs.frame_every }}
        run: |
          : > engine-command-results.jsonl
          : > engine-command-frames.jsonl
          LIMIT=$(( REPEAT > 0 ? REPEAT : 1 ))
          FRAME=$(( FRAME_EVERY > 0 ? FRAME_EVERY : 1 ))
          for iteration in $(seq 1 "$LIMIT"); do
            TMP=$(mktemp)
            STATUS=$(curl --max-time 60 --silent --show-error \
              -X POST \
              -H 'Content-Type: application/json' \
              --data "{\"requestId\":${REQUEST_ID},\"iteration\":${iteration}}" \
              --output "$TMP" \
              --write-out '%{http_code}' \
              http://127.0.0.1:8787/api/engine-command || true)
            echo "Engine command iteration $iteration HTTP ${STATUS:-000}"
            if [ "${STATUS:-000}" -lt 200 ] || [ "${STATUS:-000}" -ge 300 ]; then
              cat "$TMP" || true
              cat /tmp/echo-front-engine-control.log || true
              rm -f "$TMP"
              exit 1
            fi

            jq -c . "$TMP" >> engine-command-results.jsonl
            echo "ENGINE_CONTROL_RESULT_BEGIN iteration=$iteration"
            jq -c . "$TMP"
            echo "ENGINE_CONTROL_RESULT_END iteration=$iteration"

            if ! jq -e '
              (.ok == true)
              and ((.response.ok // true) == true)
              and (
                if ((.response.result? | type) == "array")
                then ([.response.result[] | select(.ok != true)] | length) == 0
                else true
                end
              )
            ' "$TMP" > /dev/null; then
              echo "Engine Control reported a failed command inside a successful HTTP response."
              jq -c '.response.result[]? | select(type == "object" and .ok != true)' "$TMP" || true
              cat /tmp/echo-front-engine-control.log || true
              rm -f "$TMP"
              exit 1
            fi

            if [ $((iteration % FRAME)) -eq 0 ]; then
              jq -c . "$TMP" >> engine-command-frames.jsonl
              echo "Recorded observation frame at iteration $iteration"
            fi
            rm -f "$TMP"
          done

      - name: Verify active match restart is fail-closed
        if: steps.request.outputs.id != '0'
        env:
          REQUEST_ID: ${{ steps.request.outputs.id }}
          ROOM: ${{ steps.request.outputs.room }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          PRE=$(curl --max-time 10 --silent --show-error --get \
            --data-urlencode "room=$ROOM" \
            --data-urlencode "mode=$MODE" \
            http://127.0.0.1:8787/api/diagnostics)
          echo "$PRE" | jq -e '.roomActive == true and .lifecycle.status == "active"' > /dev/null
          OLD_BOOT=$(echo "$PRE" | jq -r '.bootId')
          OLD_MATCH=$(echo "$PRE" | jq -r '.lifecycle.matchId')
          echo "Before restart: boot=$OLD_BOOT match=$OLD_MATCH"

          PID=$(cat /tmp/echo-front-engine-control.pid)
          kill -- -"$PID" 2>/dev/null || true
          for i in {1..20}; do
            if ! curl --max-time 1 --silent http://127.0.0.1:8787/api/health > /dev/null 2>&1; then break; fi
            sleep 0.25
          done

          setsid timeout 120s npx wrangler dev --port 8787 > /tmp/echo-front-engine-control-restart.log 2>&1 &
          echo $! > /tmp/echo-front-engine-control-restart.pid
          for i in {1..40}; do
            BODY=$(curl --max-time 3 --silent --show-error http://127.0.0.1:8787/api/health || true)
            ENABLED=$(printf '%s' "$BODY" | jq -r '.engineControlEnabled // false')
            LOCAL_ID=$(printf '%s' "$BODY" | jq -r '.engineCommandRequestId // 0')
            if [ "$ENABLED" = "true" ] && [ "$LOCAL_ID" = "$REQUEST_ID" ]; then break; fi
            sleep 1
          done

          POST=$(curl --max-time 10 --silent --show-error --get \
            --data-urlencode "room=$ROOM" \
            --data-urlencode "mode=$MODE" \
            http://127.0.0.1:8787/api/diagnostics)
          echo "$POST" | jq -c '{roomActive,bootId,lifecycle:{status:.lifecycle.status,previousBootId:.lifecycle.previousBootId,matchId:.lifecycle.matchId,lastHealthyAt:.lifecycle.lastHealthyAt},fatalError:{code:.fatalError.code,category:.fatalError.category,previousBootId:.fatalError.previousBootId,matchId:.fatalError.matchId}}'
          echo "$POST" | jq -e \
            --arg oldBoot "$OLD_BOOT" \
            --arg oldMatch "$OLD_MATCH" \
            '.roomActive == false
             and .lifecycle.status == "fatal"
             and .fatalError.code == "MATCH_STATE_LOST"
             and .fatalError.previousBootId == $oldBoot
             and .fatalError.matchId == $oldMatch
             and .bootId != $oldBoot' > /dev/null
          echo "Restart correctly refused to create a replacement match."

      - uses: actions/upload-artifact@v4
        if: always() && steps.request.outputs.id != '0'
        with:
          name: engine-command-${{ steps.request.outputs.id }}
          path: |
            engine-command-results.jsonl
            engine-command-frames.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Show focused Worker log on failure
        if: failure() && steps.request.outputs.id != '0'
        run: |
          cat /tmp/echo-front-engine-control.log || true
          cat /tmp/echo-front-engine-control-restart.log || true

      - name: Summary
        if: always() && steps.request.outputs.id != '0'
        run: |
          echo "### Focused Engine Control" >> "$GITHUB_STEP_SUMMARY"
          echo "Request: ${{ steps.request.outputs.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: ${{ steps.request.outputs.command }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Repeat: ${{ steps.request.outputs.repeat }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frame every: ${{ steps.request.outputs.frame_every }} iterations" >> "$GITHUB_STEP_SUMMARY"
          echo "Room: ${{ steps.request.outputs.room }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${{ steps.request.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s engine-command-frames.jsonl ]; then
            echo "Frames captured: $(wc -l < engine-command-frames.jsonl)" >> "$GITHUB_STEP_SUMMARY"
          fi
